name: Release mod update

# A normal push never publishes a build. Releases remain an explicit tag or
# manual action, so a tested package is never replaced by an ordinary commit.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Exact manifest version to release (for example 0.1.2)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import re

          with open("manifest.json", encoding="utf-8") as handle:
              manifest = json.load(handle)

          manifest_version = str(manifest.get("version", ""))
          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              version = os.environ.get("INPUT_VERSION", "").strip()
          else:
              version = os.environ.get("REF_NAME", "").removeprefix("v")

          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit(f"invalid release version: {version!r}")
          if version != manifest_version:
              raise SystemExit(
                  f"release asks for {version}, but manifest.json says {manifest_version}"
              )
          if manifest.get("github") != "anxiousintrovert/StadiumBattleFX":
              raise SystemExit("manifest github field is missing or incorrect")

          print(f"version={version}")
          print(f"tag=v{version}")
          PY

      - name: Build updater ZIP
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 tools/package_runtime.py \
            --output "dist/STADIUM_BATTLE_FX-${VERSION}.zip"
          python3 - <<'PY'
          import hashlib
          import os

          version = os.environ["VERSION"]
          name = f"STADIUM_BATTLE_FX-{version}.zip"
          path = os.path.join("dist", name)

          with open(path, "rb") as handle:
              digest = hashlib.sha256(handle.read()).hexdigest()
          with open("dist/sha256sums.txt", "w", encoding="ascii") as handle:
              handle.write(f"{digest}  {name}\n")
          print(f"built {path}: {digest}")
          PY

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists"
            exit 1
          fi
          notes=(--generate-notes)
          notes_file="RELEASE_NOTES_${VERSION}.md"
          if [[ -f "$notes_file" ]]; then
            notes=(--notes-file "$notes_file")
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "StadiumBattleFX $VERSION" \
            "${notes[@]}" \
            "dist/STADIUM_BATTLE_FX-${VERSION}.zip" \
            "dist/sha256sums.txt"
